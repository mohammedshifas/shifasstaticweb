
name: Deploy Static Website to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            "whoami"

      - name: Deploy website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -rtv \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='CODE_OF_CONDUCT.md' \
            --exclude='CONTRIBUTING.md' \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            ./ "$EC2_USER@$EC2_HOST:/var/www/html/"
